# API Contract: Todo Web Application

## Base URL
`https://api.todoapp.com` (production)
`http://localhost:8000` (development)

## Authentication
All endpoints except sign-up and sign-in require authentication via Bearer token in Authorization header:
```
Authorization: Bearer {token}
```

## Endpoints

### Authentication Endpoints

#### POST /auth/signup
**Purpose**: Register a new user account

**Request**:
```json
{
  "email": "user@example.com",
  "password": "secure_password_123"
}
```

**Response (201)**:
```json
{
  "success": true,
  "user": {
    "id": "uuid-string",
    "email": "user@example.com"
  }
}
```

**Response (400)**:
```json
{
  "error": "Invalid input",
  "details": "Email format invalid or password too weak"
}
```

**Response (409)**:
```json
{
  "error": "Conflict",
  "details": "Email already exists"
}
```

#### POST /auth/signin
**Purpose**: Authenticate user and return session token

**Request**:
```json
{
  "email": "user@example.com",
  "password": "secure_password_123"
}
```

**Response (200)**:
```json
{
  "success": true,
  "user": {
    "id": "uuid-string",
    "email": "user@example.com"
  },
  "token": "bearer-token-string"
}
```

**Response (401)**:
```json
{
  "error": "Unauthorized",
  "details": "Invalid credentials"
}
```

#### POST /auth/signout
**Purpose**: End user session

**Response (200)**:
```json
{
  "success": true,
  "message": "Signed out successfully"
}
```

### Todo Endpoints

#### GET /todos
**Purpose**: Retrieve all todos for the authenticated user

**Response (200)**:
```json
{
  "todos": [
    {
      "id": "uuid-string",
      "content": "Buy groceries",
      "completed": false,
      "created_at": "2023-12-01T10:00:00Z",
      "updated_at": "2023-12-01T10:00:00Z"
    },
    {
      "id": "uuid-string",
      "content": "Walk the dog",
      "completed": true,
      "created_at": "2023-12-01T09:00:00Z",
      "updated_at": "2023-12-01T09:30:00Z"
    }
  ]
}
```

#### POST /todos
**Purpose**: Create a new todo for the authenticated user

**Request**:
```json
{
  "content": "New todo item",
  "completed": false
}
```

**Response (201)**:
```json
{
  "todo": {
    "id": "uuid-string",
    "content": "New todo item",
    "completed": false,
    "created_at": "2023-12-01T10:00:00Z",
    "updated_at": "2023-12-01T10:00:00Z",
    "user_id": "user-uuid-string"
  }
}
```

**Response (400)**:
```json
{
  "error": "Bad Request",
  "details": "Content is required and cannot exceed 500 characters"
}
```

#### GET /todos/{id}
**Purpose**: Retrieve a specific todo by ID for the authenticated user

**Response (200)**:
```json
{
  "todo": {
    "id": "uuid-string",
    "content": "Specific todo",
    "completed": false,
    "created_at": "2023-12-01T10:00:00Z",
    "updated_at": "2023-12-01T10:00:00Z",
    "user_id": "user-uuid-string"
  }
}
```

**Response (404)**:
```json
{
  "error": "Not Found",
  "details": "Todo not found or does not belong to user"
}
```

#### PUT /todos/{id}
**Purpose**: Update an existing todo for the authenticated user

**Request**:
```json
{
  "content": "Updated todo content",
  "completed": true
}
```

**Response (200)**:
```json
{
  "todo": {
    "id": "uuid-string",
    "content": "Updated todo content",
    "completed": true,
    "created_at": "2023-12-01T10:00:00Z",
    "updated_at": "2023-12-01T11:00:00Z",
    "user_id": "user-uuid-string"
  }
}
```

#### PATCH /todos/{id}/toggle-complete
**Purpose**: Toggle the completion status of a todo

**Response (200)**:
```json
{
  "todo": {
    "id": "uuid-string",
    "content": "Specific todo",
    "completed": true,
    "created_at": "2023-12-01T10:00:00Z",
    "updated_at": "2023-12-01T11:00:00Z",
    "user_id": "user-uuid-string"
  }
}
```

#### DELETE /todos/{id}
**Purpose**: Delete a specific todo for the authenticated user

**Response (204)**:
No content returned

**Response (404)**:
```json
{
  "error": "Not Found",
  "details": "Todo not found or does not belong to user"
}
```

## Error Responses

All error responses follow the same structure:
```json
{
  "error": "Error Type",
  "details": "Human-readable error message",
  "timestamp": "ISO 8601 datetime"
}
```

## Common HTTP Status Codes
- 200: Success (GET, PUT, PATCH)
- 201: Created (POST)
- 204: No Content (DELETE)
- 400: Bad Request (invalid input)
- 401: Unauthorized (missing or invalid authentication)
- 403: Forbidden (authenticated but not authorized)
- 404: Not Found (resource does not exist)
- 409: Conflict (resource already exists)
- 500: Internal Server Error (unexpected server error)